name: Deploy to Vercel

on:
  push:
    # Só o branch de produção publica. Antes o workflow disparava também no
    # branch de trabalho e, como o mesmo commit vai para os dois, cada
    # alteração gerava DOIS deploys de produção idênticos na Vercel.
    branches:
      - claude/email-marketing-saas-M2qZP
  # Permite lançar o deploy à mão no GitHub (Actions → Deploy to Vercel →
  # Run workflow), sem ter de inventar um commit vazio.
  workflow_dispatch:

# Um deploy de produção de cada vez: dois pushes seguidos ao branch de
# produção ficam em fila em vez de correrem em paralelo a competir pelo mesmo
# domínio. Não se cancela o que está a correr, porque a Vercel continua a
# construir do lado dela e um deploy antigo poderia apontar o domínio depois
# do novo.
concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A versão do CLI está fixa de propósito. Com "npx vercel" (sem versão)
      # cada deploy instalava a versão publicada há minutos; quando a Vercel
      # publica um CLI cujas dependências ainda não estão todas disponíveis no
      # registry npm, o npm aborta com ETARGET e o deploy nunca chega a
      # arrancar — foi exactamente isso que travou os deploys
      # (vercel@59.11.0 → "No matching version found for @vercel/go@9.0.0").
      # Para actualizar: confirma que a versão nova instala e muda o número aqui.
      - name: Install Vercel CLI
        run: |
          for attempt in 1 2 3; do
            npm install -g vercel@59.10.0 && exit 0
            echo "npm install falhou (tentativa $attempt) — nova tentativa em $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "Não foi possível instalar o Vercel CLI após 3 tentativas."
          exit 1

      - name: Deploy to Vercel
        run: vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jf00Jpfp6cElvXAfxaxVal0Q
          VERCEL_PROJECT_ID: prj_8h1BsSA38ium1KAi543djG6sbnV8
