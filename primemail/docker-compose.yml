services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: primemail_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - primemail

  nginx:
    image: nginx:alpine
    container_name: primemail_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - primemail

  mysql:
    image: mysql:8.0
    container_name: primemail_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: primemail
      MYSQL_USER: primemail
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - primemail_mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - primemail

  redis:
    image: redis:7-alpine
    container_name: primemail_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - primemail_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - primemail

  minio:
    image: minio/minio:latest
    container_name: primemail_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: primemail
      MINIO_ROOT_PASSWORD: primemail_secret
    volumes:
      - primemail_minio:/data
    command: server /data --console-address ":9001"
    networks:
      - primemail

  mailpit:
    image: axllent/mailpit:latest
    container_name: primemail_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - primemail

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: primemail_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan horizon
    depends_on:
      - mysql
      - redis
    networks:
      - primemail

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: primemail_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - mysql
      - redis
    networks:
      - primemail

networks:
  primemail:
    driver: bridge

volumes:
  primemail_mysql:
  primemail_redis:
  primemail_minio:
